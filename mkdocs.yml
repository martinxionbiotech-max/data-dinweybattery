site_name: DINWEY Battery Knowledge Hub
site_url: https://docs.dinweybattery.com/
site_description: >-
  Official technical documentation for DINWEY truck and heavy-duty starting batteries —
  selection guides, JIS/DIN/BCI battery standards, CCA, and 12V vs 24V system guidance.

theme:
  name: material
  language: en
  custom_dir: overrides
  palette:
    primary: indigo
    accent: amber
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - content.code.copy

